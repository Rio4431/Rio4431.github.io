<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Software projects by Rio4431: research, laboratory, document, image-processing, and productivity tools.">
  <title>Rio4431 | Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="Portfolio home">Rio4431</a>
      <div class="header-actions">
        <nav class="nav" aria-label="Primary navigation">
          <a href="#projects" data-i18n="navProjects">Projects</a>
          <a href="#about" data-i18n="navAbout">About</a>
        </nav>
        <div class="language-switch" aria-label="Language">
          <button type="button" id="langJa">日本語</button>
          <button type="button" id="langEn">English</button>
        </div>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-inner">
        <p class="eyebrow" data-i18n="eyebrow">PORTFOLIO</p>
        <h1 data-i18n="heroTitle">制作したツール</h1>
        <p class="hero-lead" data-i18n="heroLead">画像処理、文献探索、PDF処理、実験計算などのツールを掲載しています。</p>
        <div class="hero-links">
          <a class="button primary" href="#projects" data-i18n="viewProjects">作品を見る</a>
          <a class="button secondary" href="https://github.com/Rio4431" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
      </div>
    </section>

    <section id="projects" class="section">
      <div class="section-heading">
        <div>
          <p class="section-kicker" data-i18n="projectsKicker">Portfolio</p>
          <h2 data-i18n="projectsTitle">Projects</h2>
        </div>
      </div>

      <div id="projectGrid" class="project-grid" aria-live="polite"></div>
      <noscript>This portfolio requires JavaScript to display the projects.</noscript>
    </section>

    <section id="about" class="section about-section">
      <div class="about-card">
        <p class="section-kicker" data-i18n="aboutKicker">About this portfolio</p>
        <h2 data-i18n="aboutTitle">このポートフォリオについて</h2>
        <p data-i18n="aboutText1">このページはGitHubの全Publicリポジトリ一覧ではなく、ポートフォリオとして選んだプロジェクトを紹介しています。</p>
        <p data-i18n="aboutText2">各作品では、概要、使用技術、実際に動くWebアプリ、ソースコードへのリンクを確認できます。</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© <span id="year"></span> Rio4431</span>
      <a href="https://github.com/Rio4431" target="_blank" rel="noopener noreferrer">github.com/Rio4431 ↗</a>
    </div>
  </footer>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
